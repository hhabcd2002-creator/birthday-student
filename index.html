<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Memory Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-sky-100 via-indigo-50 to-blue-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <main class="container mx-auto px-4 py-8 max-w-4xl">
        
        <div id="todayBanner" class="hidden bg-white/90 backdrop-blur-md border-2 border-amber-300 shadow-xl rounded-2xl p-6 text-center mb-8 relative overflow-hidden animate-bounce-short">
            <div class="absolute -top-10 -left-10 w-24 h-24 bg-amber-200 rounded-full opacity-50 blur-lg"></div>
            <div class="absolute -bottom-10 -right-10 w-24 h-24 bg-pink-200 rounded-full opacity-50 blur-lg"></div>
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-sky-500 mb-3">
                🎉 Today's Birthday Stars 🎉
            </h1>
            <div id="todayNames" class="text-2xl font-bold text-sky-900 mb-4"></div>
            <p id="todayWish" class="text-slate-600 italic font-medium max-w-2xl mx-auto leading-relaxed"></p>
        </div>

        <header class="text-center mb-10">
            <h2 class="text-3xl font-bold text-sky-900 tracking-tight mb-2">🎈 Birthday Memory Hub 🎈</h2>
            <p class="text-slate-500 text-sm">Special memories of our beloved teachers and students</p>
        </header>

        <div id="mainMenu" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <button onclick="showNearBirthdays()" class="cursor-pointer bg-white/80 hover:bg-white p-6 rounded-2xl border border-sky-100/50 shadow-sm transition-all duration-300 transform hover:-translate-y-1 text-center group">
                <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">⏰</div>
                <h3 class="text-lg font-bold text-sky-950">Upcoming Birthdays</h3>
                <p class="text-xs text-slate-400 mt-1">Birthdays in the nearest month</p>
            </button>

            <button onclick="showTeachers()" class="cursor-pointer bg-white/80 hover:bg-white p-6 rounded-2xl border border-sky-100/50 shadow-sm transition-all duration-300 transform hover:-translate-y-1 text-center group">
                <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🏢</div>
                <h3 class="text-lg font-bold text-slate-700">Teachers</h3>
                <p class="text-xs text-slate-400 mt-1">List of our respected teachers</p>
            </button>

            <button onclick="toggleStudentYears()" class="cursor-pointer bg-white/80 hover:bg-white p-6 rounded-2xl border border-sky-100/50 shadow-sm transition-all duration-300 transform hover:-translate-y-1 text-center group">
                <div class="text-4xl mb-3 group-hover:scale-110 transition-transform">🎓</div>
                <h3 class="text-lg font-bold text-emerald-800">Students</h3>
                <p class="text-xs text-slate-400 mt-1">View birthdays by class level</p>
            </button>
        </div>

        <div id="studentYearSection" class="hidden bg-white/70 backdrop-blur-sm p-5 rounded-2xl border border-sky-100/50 text-center mb-8">
            <p class="text-xs font-semibold text-slate-500 mb-4 uppercase tracking-wider">Select a Class Grade</p>
            <div class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-9 gap-2">
                <button onclick="showStudentsByYear('Year-1')" class="cursor-pointer px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Year 1</button>
                <button onclick="showStudentsByYear('Year-2')" class="cursor-pointer px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Year 2</button>
                <button onclick="showStudentsByYear('Year-3')" class="cursor-pointer px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Year 3</button>
                <button onclick="showStudentsByYear('Year-4')" class="cursor-pointer px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Year 4</button>
                <button onclick="showStudentsByYear('Year-5')" class="cursor-pointer px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Year 5</button>
                <button onclick="showStudentsByYear('Year-6')" class="cursor-pointer px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Year 6</button>
                <button onclick="showStudentsByYear('Year-7')" class="cursor-pointer px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Year 7</button>
                <button onclick="showStudentsByYear('Year-8')" class="cursor-pointer px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Year 8</button>
                <button onclick="showStudentsByYear('Year-9')" class="cursor-pointer px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors">Year 9</button>
            </div>
        </div>

        <div id="displaySection" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h3 id="sectionTitle" class="text-xl font-bold text-sky-900">List</h3>
                <button onclick="closeDisplay()" class="cursor-pointer text-xs font-medium text-slate-400 hover:text-slate-600 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">◀ Close</button>
            </div>
            <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </div>

        <div id="loading" class="text-center py-10 text-slate-400 font-medium text-sm">
            <span class="inline-block animate-spin mr-2">🔄</span> Fetching data, please wait...
        </div>

    </main>

    <footer class="text-center py-6 border-t border-sky-100/30 bg-white/30 text-xs font-bold tracking-wide text-sky-900/60 uppercase">
        Created by Sir Htet
    </footer>

    <script>
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxHkclv0R8xra6_-B9ZohDKOogazdDxRq2bnalHs8wyHUdqaxkahhO4xgukLozPLrQhkw/exec"; 
        
        let birthdayData = [];

        // Wishes text in English
        const teacherWishes = [
            "May this special day bring you endless joy, health, and prosperity. Thank you for being an inspiring guide and a wonderful teacher. Happy Birthday!",
            "Wishing you a very happy birthday! May you continue to shine bright and lead the next generation with your boundless wisdom and knowledge."
        ];

        const studentWishes = [
            "Happy Birthday! May all your dreams and wishes come true. Wishing you great success in your studies and a wonderful year ahead!",
            "Have a fantastic birthday! Stay bright, stay curious, and may you score excellent marks in all your upcoming exams. Enjoy your day!"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            fetch(SHEET_API_URL)
                .then(response => response.json())
                .then(data => {
                    birthdayData = data;
                    document.getElementById("loading").classList.add("hidden");
                    checkTodayBirthdays();
                })
                .catch(err => {
                    document.getElementById("loading").innerText = "Failed to load data. Please check your API URL.";
                    console.error(err);
                });
        });

        function checkTodayBirthdays() {
            const today = new Date();
            const monthNamesEn = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            
            const currentDayStr = ("0" + today.getDate()).slice(-2); 
            const currentMonthStr = monthNamesEn[today.getMonth()]; 
            
            const todaysWinners = birthdayData.filter(p => {
                if (!p.Birthday) return false;
                const parts = p.Birthday.split(" "); 
                return parts.length >= 2 && parts[0] === currentDayStr && parts[1] === currentMonthStr;
            });
            
            if(todaysWinners.length > 0) {
                const names = todaysWinners.map(p => `${p.Name} (${p.Role.toLowerCase() === 'teacher' ? 'Teacher' : p.Year})`).join(", ");
                document.getElementById("todayNames").innerText = names;
                
                const isTeacher = todaysWinners.some(p => p.Role.toLowerCase() === 'teacher');
                const wishBank = isTeacher ? teacherWishes : studentWishes;
                const randomWish = wishBank[Math.floor(Math.random() * wishBank.length)];
                document.getElementById("todayWish").innerText = randomWish;
                
                document.getElementById("todayBanner").classList.remove("hidden");
                triggerConfetti();
            }
        }

        function triggerConfetti() {
            var duration = 5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        function showNearBirthdays() {
            hideStudentYears();
            const today = new Date();
            let checkMonthIndex = today.getMonth(); 
            let loopCount = 0;
            let currentFiltered = [];
            let targetMonthName = "";

            const monthNamesEnFull = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const monthNamesEn = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

            while (loopCount < 12) {
                let targetMonthEn = monthNamesEn[checkMonthIndex];
                currentFiltered = birthdayData.filter(p => {
                    if (!p.Birthday) return false;
                    const parts = p.Birthday.split(" ");
                    return parts.length >= 2 && parts[1] === targetMonthEn;
                });
                
                if(currentFiltered.length > 0) {
                    targetMonthName = monthNamesEnFull[checkMonthIndex];
                    break;
                }
                checkMonthIndex = checkMonthIndex === 11 ? 0 : checkMonthIndex + 1;
                loopCount++;
            }

            const isCurrentMonth = today.getMonth() === checkMonthIndex;
            const titleText = isCurrentMonth 
                ? `⏰ Birthdays in Current Month (${targetMonthName})` 
                : `🔍 No birthdays this month. Nearest birthdays found in (${targetMonthName})`;
            
            renderCards(currentFiltered, titleText);
        }

        function showTeachers() {
            hideStudentYears();
            const teachers = birthdayData.filter(p => p.Role.toLowerCase() === 'teacher');
            renderCards(teachers, "🏢 Respected Teachers' Birthdays");
        }

        function toggleStudentYears() {
            closeDisplay();
            const section = document.getElementById("studentYearSection");
            section.classList.toggle("hidden");
        }

        function hideStudentYears() {
            document.getElementById("studentYearSection").classList.add("hidden");
        }

        function showStudentsByYear(year) {
            const students = birthdayData.filter(p => p.Role.toLowerCase() === 'student' && p.Year === year);
            renderCards(students, `🎓 Students List (${year})`);
        }

        function renderCards(list, title) {
            document.getElementById("sectionTitle").innerText = title;
            const grid = document.getElementById("cardsGrid");
            grid.innerHTML = "";

            if(list.length === 0) {
                grid.innerHTML = `<p class="col-span-2 text-center text-slate-400 py-6 text-sm">No records found.</p>`;
            } else {
                list.forEach(p => {
                    const isTeacher = p.Role.toLowerCase() === 'teacher';
                    const themeClass = isTeacher 
                        ? "border-l-4 border-slate-700 bg-slate-50/80" 
                        : "border-l-4 border-emerald-400 bg-emerald-50/50";
                    
                    const roleBadge = isTeacher 
                        ? `<span class="bg-slate-700 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">Teacher</span>`
                        : `<span class="bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">${p.Year}</span>`;

                    grid.innerHTML += `
                        <div class="bg-white/90 p-4 rounded-xl shadow-xs border border-slate-100/50 flex justify-between items-center ${themeClass}">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h4 class="font-bold text-slate-800 text-base">${p.Name}</h4>
                                    ${roleBadge}
                                </div>
                                <p class="text-xs text-slate-400 font-medium">📅 Date - ${p.Birthday}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xl">🎂</span>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById("displaySection").classList.remove("hidden");
            document.getElementById("displaySection").scrollIntoView({ behavior: 'smooth' });
        }

        function closeDisplay() {
            document.getElementById("displaySection").classList.add("hidden");
        }
    </script>
</body>
</html>
